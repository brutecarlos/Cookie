<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cookie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="container" class="card" role="dialog" aria-label="Daily fortune">
    <button id="dismiss" class="dismiss" aria-label="Dismiss">×</button>
    <div class="content">
      <div id="quote" class="quote">Loading…</div>
      <div id="author" class="author"></div>
      <div id="settings" class="settings">
        <label class="switch">
          <input type="checkbox" id="autoOpen">
          <span class="slider"></span>
        </label>
        <label for="autoOpen" class="settingsLabel">Auto-open daily popup</label>
      </div>
      <!-- anonymous stats disabled -->
      <div id="controls">
        <button id="copy">Copy</button>
        <button id="share">Share</button>
      </div>
    </div>
    <div id="progress" class="progress" aria-hidden="true"><div id="progressBar" class="progressBar"></div></div>
    <div id="foot" class="foot">One quote per day</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
